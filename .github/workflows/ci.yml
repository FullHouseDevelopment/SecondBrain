name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Shared workflow policy
    uses: FullHouseDevelopment/AutoDev/.github/workflows/profile-baseline.yml@b10a3f2a7bd52e01c78554dbc317300e180d690e
    with:
      ref: ${{ github.sha }}
      require_concurrency: true
    permissions:
      contents: read

  headless-dotnet:
    name: Headless .NET validation
    needs: [baseline]
    uses: FullHouseDevelopment/AutoDev/.github/workflows/profile-dotnet.yml@b10a3f2a7bd52e01c78554dbc317300e180d690e
    with:
      ref: ${{ github.sha }}
      global_json_file: global.json
      restore_command: dotnet restore SecondBrain.Headless.slnx
      build_command: dotnet build SecondBrain.Headless.slnx --configuration Debug --no-restore
      test_command: dotnet test SecondBrain.Headless.slnx --configuration Debug --no-build --no-restore --logger "trx"
      test_results_path: '**/TestResults/*.trx'
      artifact_name: secondbrain-headless-test-results
    permissions:
      contents: read

  maui-validation:
    name: MAUI product validation
    needs: [baseline]
    uses: FullHouseDevelopment/AutoDev/.github/workflows/profile-maui.yml@b10a3f2a7bd52e01c78554dbc317300e180d690e
    with:
      ref: ${{ github.sha }}
      global_json_file: global.json
      headless_enabled: false

      android_enabled: true
      android_setup_command: dotnet workload install maui-android
      android_restore_command: dotnet restore SecondBrain.Presentation/SecondBrain.Presentation.csproj
      android_build_command: dotnet build SecondBrain.Presentation/SecondBrain.Presentation.csproj --configuration Debug --no-restore -f net10.0-android
      android_test_command: dotnet test SecondBrain.Headless.slnx --configuration Debug --logger "trx"
      android_test_results_path: '**/TestResults/*.trx'
      android_runtime_smoke_command: |
        ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd" \
        SECOND_BRAIN_AVD_NAME=secondbrain-ci \
        SECOND_BRAIN_EMULATOR_LOG="$RUNNER_TEMP/android-emulator.log" \
        scripts/test-linux-android.sh
      android_runtime_java_distribution: microsoft
      android_runtime_java_version: '21'
      android_runtime_timeout_minutes: 45

      windows_enabled: true
      windows_setup_command: dotnet workload install maui
      windows_restore_command: dotnet restore SecondBrain.Presentation/SecondBrain.Presentation.csproj
      windows_build_command: dotnet build SecondBrain.Presentation/SecondBrain.Presentation.csproj --configuration Debug --no-restore -f net10.0-windows10.0.19041.0
      windows_test_command: dotnet test SecondBrain.Headless.slnx --configuration Debug --logger "trx"
      windows_test_results_path: '**/TestResults/*.trx'
    permissions:
      contents: read
