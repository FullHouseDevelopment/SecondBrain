name: Version advancement

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: version-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  versionIntent:
    name: Version intent
    if: github.event_name == 'pull_request'
    uses: FullHouseDevelopment/AutoDev/.github/workflows/version-intent.yml@b10a3f2a7bd52e01c78554dbc317300e180d690e
    with:
      pr_body: ${{ github.event.pull_request.body }}
      head: ${{ github.sha }}
    permissions:
      contents: read

  versionTag:
    name: Advance trusted version tag
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    uses: FullHouseDevelopment/AutoDev/.github/workflows/version-tag.yml@b10a3f2a7bd52e01c78554dbc317300e180d690e
    with:
      head: ${{ github.event.workflow_run.head_sha }}
      branch: main
    permissions:
      contents: write
      pull-requests: read
